[project]
name = "ecoharmony-comprar-entradas"
version = "0.1.0"
description = "TP6 TDD - Aplicación web para comprar entradas a EcoHarmony Park"
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
DJANGO_SETTINGS_MODULE = "tests.settings"
